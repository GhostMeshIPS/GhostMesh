; GhostMesh firmware. One build per board, because each board's secret keys are
; compiled in from firmware/config/keys/keys_<N>.h (run `python security/keygen.py` once first).
;
;   pio run -e A -t upload        flash board A (then B, C, D the same way)
;   pio device monitor            115200 baud, one JSON object per line
;
; Laptop integration test (no hardware):  python test/node/run_node_tests.py

[platformio]
default_envs = A

[env]
; Arduino-ESP32 core 3.x (ESP-IDF 5.x) via the community pioarduino platform
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB          ; ESP32-S3 Super Mini
board_build.partitions = default.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1        ; Serial = native USB, otherwise you see nothing
    -DARDUINO_USB_MODE=1
    -DGM_LED_PIN=48                    ; Super Mini onboard WS2812
    -DGM_OLED_SDA=8
    -DGM_OLED_SCL=9
    -Isrc/node -Isrc/routing -Isrc/crypto -Iconfig/keys
build_src_filter = +<*> -<watchtower/>      ; nodes: everything except the watchtower
lib_deps =
    monocypher                         ; vendored in lib/monocypher (Jose)
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2
    https://github.com/olikraus/U8g2_Arduino.git#2.36.19

[env:A]
build_flags = ${env.build_flags} -DGM_KEYS_FILE=\"keys_A.h\"

[env:B]
build_flags = ${env.build_flags} -DGM_KEYS_FILE=\"keys_B.h\"

[env:C]
build_flags = ${env.build_flags} -DGM_KEYS_FILE=\"keys_C.h\"

[env:D]
build_flags = ${env.build_flags} -DGM_KEYS_FILE=\"keys_D.h\"

[env:W]
; Watchtower: own main (TIME beacons, IPS log lines, BLOCK). Stays plugged into the laptop.
build_flags = ${env.build_flags} -Isrc/watchtower -DGM_KEYS_FILE=\"keys_W.h\"
build_src_filter = +<*> -<main.cpp> -<node_serial.cpp> -<node/board_keys.c>

; [env:X] attacker: Wednesday
