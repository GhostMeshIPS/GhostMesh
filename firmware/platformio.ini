; GhostMesh firmware. One build per board, because each board's secret keys are
; compiled in from firmware/config/keys/keys_<N>.h (run `python security/keygen.py` once first).
;
;   pio run -e A -t upload        flash board A (then B, C, D the same way)
;   pio device monitor            115200 baud, one JSON object per line
;
; Laptop integration test (no hardware):  python test/node/run_node_tests.py

[platformio]
default_envs = A

[common]
build_flags = -Isrc/node -Isrc/routing -Isrc/crypto -Iconfig/keys

; W and X are ESP32-WROOM-32E dev boards, not S3 Super Minis: classic ESP32 chip, Serial goes through
; the USB-UART bridge (CP210x/CH340), so the baud rate is real and must match the laptop (921600: W's log
; and X's frame traffic need it; 115200 tops out around 20 lines/s). No RGB LED (plain LED on GPIO2,
; if the board has one). No OLED: GPIO 6-11 are the flash pins on this chip, so never use 8/9 here.
[wroom]
board = esp32dev
board_upload.flash_size = 4MB
monitor_speed = 921600
build_flags =
    ${common.build_flags}
    -DGM_SERIAL_BAUD=921600
    -DGM_LED_PIN=2
    -DGM_LED_PLAIN=1

[env]
; Arduino-ESP32 core 3.x (ESP-IDF 5.x) via the community pioarduino platform
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB          ; ESP32-S3 Super Mini
board_build.partitions = default.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1        ; Serial = native USB, otherwise you see nothing
    -DARDUINO_USB_MODE=1
    -DGM_LED_PIN=48                    ; Super Mini onboard WS2812
    -DGM_OLED_SDA=8
    -DGM_OLED_SCL=9
build_src_filter = +<*> -<watchtower/> -<attacker/>      ; nodes: everything except the watchtower and attacker
lib_deps =
    monocypher                         ; vendored in lib/monocypher (Jose)
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2
    https://github.com/olikraus/U8g2_Arduino.git#2.36.19

[env:A]
build_flags = ${env.build_flags} -DGM_KEYS_FILE=\"keys_A.h\"

[env:B]
build_flags = ${env.build_flags} -DGM_KEYS_FILE=\"keys_B.h\"

[env:C]
build_flags = ${env.build_flags} -DGM_KEYS_FILE=\"keys_C.h\"

[env:D]
build_flags = ${env.build_flags} -DGM_KEYS_FILE=\"keys_D.h\"

[env:W]
; Watchtower: own main (TIME beacons, IPS log lines, BLOCK). Stays plugged into the laptop.
board = ${wroom.board}
board_upload.flash_size = ${wroom.board_upload.flash_size}
monitor_speed = ${wroom.monitor_speed}
build_flags = ${wroom.build_flags} -Isrc/watchtower -DGM_KEYS_FILE=\"keys_W.h\"
build_src_filter = +<*> -<main.cpp> -<node_serial.cpp> -<node/board_keys.c> -<attacker/>

[env:X]
; Attacker X (decision 18): radio passthrough for security/attacks/. Holds NO keys and never transmits
; on its own; the laptop scripts craft every frame. The raw-transmit command exists only in this build.
; Never flash it onto a demo node.
board = ${wroom.board}
board_upload.flash_size = ${wroom.board_upload.flash_size}
monitor_speed = ${wroom.monitor_speed}
build_flags = ${wroom.build_flags}
build_src_filter = +<*> -<main.cpp> -<node_serial.cpp> -<node/board_keys.c> -<watchtower/>
